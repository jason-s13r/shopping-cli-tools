[package]
name = "farmers-api"
version = "0.1.0"
edition = "2021"
description = "Client for the Farmers New Zealand storefront: catalogue, search, stores, stock, cart and account"
license = "MIT"
publish = false

[dependencies]
net-kit = { path = "../net-kit", version = "^0.1.2" }
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
