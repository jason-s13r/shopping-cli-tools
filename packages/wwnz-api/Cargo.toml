[package]
name = "wwnz-api"
version = "0.1.2"
edition = "2021"
description = "Client for the Woolworths NZ GraphQL API and its Auth0 login flow"
license = "MIT"
publish = false

[dependencies]
net-kit = { path = "../net-kit", version = "^0.1.2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"

[dev-dependencies]
base64 = "0.22"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
