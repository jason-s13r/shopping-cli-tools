[package]
name = "fsnz-api"
version = "0.2.1"
edition = "2021"
description = "Client for the Foodstuffs NZ (New World, PAK'nSAVE) edge API and Club Plus login"
license = "MIT"
publish = false

[dependencies]
net-kit = { path = "../net-kit", version = "^0.1.2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
base64 = "0.22"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
