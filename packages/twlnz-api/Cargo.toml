[package]
name = "twlnz-api"
version = "0.2.1"
edition = "2021"
description = "Client for The Warehouse NZ storefront: its listing, product, cart and store endpoints"
license = "MIT"
publish = false

[dependencies]
net-kit = { path = "../net-kit", version = "^0.1.2" }
ego-tree = "0.10"
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"

[dev-dependencies]
base64 = "0.22"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
