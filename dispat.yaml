tagFormat: "{name}/v{version}"
github:
  allPackages: true
commit:
  enabled: true
  push: true
spaces:
  apps:
    path: apps
    autoVersion:
      enabled: true
      range: caret
  packages:
    path: packages
    autoVersion:
      enabled: true
      range: caret
dependencies:
  build-kit: [net-kit]
  gsnz-ui: [gsnz-core, cli-kit]
  fsnz-api: [net-kit]
  wwnz-api: [net-kit]
  twlnz-api: [net-kit]
  kmart-api: [net-kit]
  foodstuffs-nz-cli: [gsnz-core, gsnz-ui, cli-kit, net-kit, fsnz-api, build-kit]
  woolworths-nz-cli: [gsnz-core, gsnz-ui, cli-kit, net-kit, wwnz-api, build-kit]
  grocery-nz-cli: [gsnz-core, gsnz-ui, cli-kit, net-kit, fsnz-api, wwnz-api, build-kit]
  the-warehouse-nz-cli: [cli-kit, net-kit, twlnz-api, build-kit]
  kmart-cli: [cli-kit, net-kit, kmart-api, build-kit]
  bgnz-api: [net-kit]
  briscoe-group-nz-cli: [cli-kit, net-kit, bgnz-api, build-kit]
  mitre10-api: [net-kit]
  mitre10-nz-cli: [cli-kit, net-kit, mitre10-api, build-kit]
  farmers-api: [net-kit]
  farmers-nz-cli: [cli-kit, net-kit, farmers-api, build-kit]
