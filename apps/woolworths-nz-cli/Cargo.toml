[package]
name = "woolworths-nz-cli"
version = "0.3.2"
edition = "2021"
description = "Unofficial CLI for Woolworths NZ product search, cart and orders"
license = "MIT"

[[bin]]
name = "wwnz"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
thiserror = "2"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "fs"] }
toml = "0.9"

build-kit = { path = "../../packages/build-kit", version = "^0.3.0" }
cli-kit = { path = "../../packages/cli-kit", version = "^0.3.0" }
gsnz-core = { path = "../../packages/gsnz-core", version = "^0.2.0" }
gsnz-ui = { path = "../../packages/gsnz-ui", version = "^0.2.0" }
net-kit = { path = "../../packages/net-kit", version = "^0.1.2" }
wwnz-api = { path = "../../packages/wwnz-api", version = "^0.1.1" }

# The stamping half only. Its runtime deps -- the whole HTTP stack -- have no
# business being built before the crate itself is.
#
# No `version` here, unlike [dependencies]: dispat rewrites one range per
# manifest, so a package declared twice leaves the second pinned to a version
# that no longer exists. A path dependency only needs a version to be
# publishable, and nothing here is published.
[build-dependencies]
build-kit = { path = "../../packages/build-kit", default-features = false, features = ["emit"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
serde_json = "1"
tempfile = "3"

[profile.release]
strip = true
