[package]
name = "kmart-cli"
version = "0.2.1"
edition = "2021"
description = "An unofficial command line tool for Kmart Australia and New Zealand"
license = "MIT"
publish = false

[[bin]]
name = "kmart"
path = "src/main.rs"

[dependencies]
# `build-kit` is also a build dependency below. The version belongs on exactly
# one of the two: dispat rewrites the first range it finds, so a second one
# carrying a version is left pinned to a release that no longer exists.
build-kit = { path = "../../packages/build-kit", version = "^0.3.0" }
cli-kit = { path = "../../packages/cli-kit", version = "^0.3.0" }
kmart-api = { path = "../../packages/kmart-api", version = "^0.2.1" }
net-kit = { path = "../../packages/net-kit", version = "^0.1.2" }

clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
toml = "0.9"

[build-dependencies]
build-kit = { path = "../../packages/build-kit", default-features = false, features = ["emit"] }

[dev-dependencies]
assert_cmd = "2"
serde_json = "1"
predicates = "3"
tempfile = "3"
